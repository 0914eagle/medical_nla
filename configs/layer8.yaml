run_name: pilot
seed: 17

paths:
  code_root: ${MEDICAL_NLA_CODE_ROOT}
  artifact_root: ${MEDICAL_NLA_DATA_ROOT}/medical_nla
  data_dir: ${MEDICAL_NLA_DATA_ROOT}/medical_nla/data
  activation_dir: ${MEDICAL_NLA_DATA_ROOT}/medical_nla/activations
  result_dir: ${MEDICAL_NLA_DATA_ROOT}/medical_nla/results
  report_dir: ${MEDICAL_NLA_DATA_ROOT}/medical_nla/reports
  log_dir: ${MEDICAL_NLA_DATA_ROOT}/medical_nla/logs
  train_dir: ${MEDICAL_NLA_DATA_ROOT}/medical_nla/train
  raw_dir: ${MEDICAL_NLA_DATA_ROOT}
  # The hub directory itself, not its parent. `from_pretrained(cache_dir=X)`
  # and `hf_hub_download(cache_dir=X)` treat X as the cache, the way the
  # deprecated TRANSFORMERS_CACHE did -- while HF_HOME names the parent and
  # puts the cache in HF_HOME/hub. Pointing this at $HF_HOME gave two caches
  # and two downloads of every checkpoint, 46GB of duplicates before it showed.
  cache_dir: ${MEDICAL_NLA_DATA_ROOT}/hf_cache/hub

source_model:
  model_id: google/gemma-3-12b-it
  dtype: bfloat16
  # "auto" so the 12B backbone can span two cards -- 24.4GB in bfloat16 does
  # not fit on one 24GB card.
  device_map: auto
  # Stated rather than inferred. Left to its own heuristic, accelerate put a
  # fifth of this model on meta while every card was empty, and a meta tensor
  # fails minutes later inside cuBLAS with an error naming neither the offload
  # nor the memory. Two cards are named on purpose: the model needs about 44GB
  # of the 48, and cards 2 and 3 stay free for a second job.
  # On a machine with different GPUs, adjust or delete this -- load_causal_lm
  # refuses a partly offloaded model at load time and prints the free memory.
  max_memory:
    0: 22GiB
    1: 22GiB
  trust_remote_code: true
  layer: 8
  hidden_state_index_offset: 0

activation:
  # last_token, token_index, token_span, or target_text.
  # target_text maps a substring to tokenizer offsets; default strategy takes
  # the final subword token in the matched span.
  position_mode: last_token
  default_token_index: null
  default_token_span: null
  target_text_strategy: last_subtoken
  target_text_occurrence: 0
  batch_size: 8

nla_model:
  model_id: kitft/nla-gemma3-12b-L32-av
  ar_model_id: kitft/nla-gemma3-12b-L32-ar
  adapter_id: null
  dtype: bfloat16
  # The same treatment as source_model, and for a sharper reason: this model is
  # loaded for *training*, so beyond its 23.6GB of bfloat16 weights the card
  # also holds activations for the batch, gradients, and the optimizer state.
  # Left on one card it loaded at 100% of cuda:0 -- 23.5GB of a 24GB card --
  # and the first forward pass died asking for 84MB.
  device_map: auto
  max_memory:
    0: 22GiB
    1: 22GiB
  trust_remote_code: true
  sidecar_filename: nla_meta.yaml
  # NLA sidecar values are mandatory. These optional fields are only for hard
  # failure if the downloaded sidecar does not match the intended Gemma-3-12B run.
  expected_d_model: 3840
  expected_injection_token_id: 246566

generation:
  do_sample: false
  max_new_tokens: 256
  temperature: null
  top_p: null

inputs:
  general: data/prompts_general.jsonl
  medical: data/prompts_medical.jsonl
